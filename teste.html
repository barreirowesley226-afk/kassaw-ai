<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kassaw AI — Estudos</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      height: 88vh;
      background: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .topo {
      padding: 14px 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topo h1 { margin: 0; font-size: 18px; }
    .topo span { font-size: 12px; color: #38bdf8; }
    .modos {
      display: flex;
      gap: 6px;
      padding: 10px;
      overflow-x: auto;
      background: #172033;
      border-bottom: 1px solid #334155;
    }
    .modo-btn {
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .modo-btn.ativo {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      font-weight: bold;
    }
    .chat {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }
    .form-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }
    input {
      flex: 1;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    button.enviar {
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topo">
      <h1>Kassaw AI</h1>
      <span>Assistente de Estudos</span>
    </div>

    <div class="modos" id="modos">
      <button class="modo-btn ativo" data-modo="Explicar simples">Explicar simples</button>
      <button class="modo-btn" data-modo="Passo a passo">Passo a passo</button>
      <button class="modo-btn" data-modo="Mini-quiz">Mini-quiz</button>
      <button class="modo-btn" data-modo="Resumo">Resumo</button>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">Olá! Sou o Kassaw AI. Escolhe um modo acima e manda a tua dúvida de estudo para testarmos!</div>
    </div>

    <form class="form-area" id="form-chat">
      <input type="text" id="campo-texto" placeholder="Escreve a tua dúvida aqui..." required />
      <button type="submit" class="enviar">Enviar</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form-chat");
    const input = document.getElementById("campo-texto");
    const botoesModo = document.querySelectorAll(".modo-btn");

    let modoAtual = "Explicar simples";

    botoesModo.forEach((btn) => {
      btn.addEventListener("click", () => {
        botoesModo.forEach((b) => b.classList.remove("ativo"));
        btn.classList.add("ativo");
        modoAtual = btn.dataset.modo;
      });
    });

    function adicionarMensagem(texto, tipo) {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function respostaSimulada(pergunta, modo) {
      if (modo === "Passo a passo") {
        return `[Passo a passo]\nPara resolver "${pergunta}":\n1. Identifica o que o enunciado pede.\n2. Separa os dados que já tens.\n3. Aplica a fórmula ou regra certa sem pular etapas.`;
      }
      if (modo === "Mini-quiz") {
        return `[Mini-quiz sobre "${pergunta}"]\n1. Qual é a ideia principal desse tema?\n2. Quando é que essa regra não se aplica?\nResponde aqui para testarmos!`;
      }
      if (modo === "Resumo") {
        return `[Resumo rápido]\nTema: ${pergunta}\n• Ponto chave 1: definição curta.\n• Ponto chave 2: onde aparece nas provas.\n• Dica: revê um exemplo prático.`;
      }
